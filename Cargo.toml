[package]
name = "egui_styled"
version = "0.8.1"
edition = "2024"
rust-version = "1.95"
authors = ["David Spray <dev@david-spray.me>"]
description = "Tailwind-style utility styling for egui: per-widget hover/focus/active variants, design tokens, and composable style functions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/dspray95/egui_styled"
documentation = "https://docs.rs/egui_styled"
readme = "README.md"
keywords = ["egui", "gui", "styling", "theme", "ui"]
categories = ["gui"]
exclude = ["docs/", ".github/", "target/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# CSS-style `backdrop-filter: blur()` on containers. wgpu backend only.
backdrop-blur = ["dep:egui-wgpu"]

[dependencies]
egui = "0.37.0"
egui-wgpu = { version = "0.37.0", optional = true, default-features = false }

# egui-wgpu's defaults on web: WebGPU/WebGL backends, plus `Send + Sync` wgpu types for its
# callback bounds. eframe's `wgpu` feature enables the same set.
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { version = "0.37.0", optional = true }

[dev-dependencies]
eframe = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["snapshot", "wgpu"] }

[[example]]
name = "backdrop_blur"
required-features = ["backdrop-blur"]

[[example]]
name = "backdrop_game"
required-features = ["backdrop-blur"]
